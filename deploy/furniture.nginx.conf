limit_req_zone $binary_remote_addr zone=furniture_ai:10m rate=12r/m;
limit_req_zone $binary_remote_addr zone=furniture_api:10m rate=120r/m;

server {
    listen 80;
    listen [::]:80;
    server_name furniture.zhenpinfa.cn;
    root /opt/3d-furniture/current/dist;
    client_max_body_size 128k;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options SAMEORIGIN always;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/furniture-acme;
    }

    location = /api/design {
        limit_req zone=furniture_ai burst=3 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:8787;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 65s;
    }

    location /api/ {
        limit_req zone=furniture_api burst=20 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:8787;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 65s;
    }

    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
